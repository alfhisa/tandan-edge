# T2 — YOLO11n with RepC3k2 in the backbone
# =========================================
# Only change from yolo11.yaml: the backbone C3k2 blocks (layers 2, 4, 6, 8)
# become RepC3k2 (re-parameterizable; fused into a single conv for inference).
# The neck C3k2 blocks are unchanged. Register RepC3k2 first with
# scripts/train/register_repc3k2.py.

nc: 5 # dead, healthy, mismanaged, smallish, yellowish
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (C3k2 -> RepC3k2 at layers 2, 4, 6, 8)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, RepC3k2, [256, False, 0.25]] # 2   <-- MODIFIED (was C3k2)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, RepC3k2, [512, False, 0.25]] # 4   <-- MODIFIED
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, RepC3k2, [512, True]] # 6           <-- MODIFIED
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, RepC3k2, [1024, True]] # 8          <-- MODIFIED
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head (neck C3k2 unchanged)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
