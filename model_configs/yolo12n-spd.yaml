# TANDAN Journal 1 — Modification A1: YOLOv12n + SPD-Conv
# =========================================================
# Base: official yolo12.yaml (Ultralytics)
# Change: strided Conv at P3/8, P4/16, P5/32 (backbone layers 3, 5, 7)
#         replaced with SPDConv (space-to-depth + non-strided conv).
#
# Rationale: preserve spatial information during downsampling in the deeper
# backbone stages where small-object features (smallish, mismanaged palms)
# concentrate. P1/P2 strided convs are kept to retain early-stage efficiency
# for Jetson Nano deployment.
#
# Unchanged from base: P1/P2 downsampling, all C3k2/A2C2f blocks, head topology.
#
# Custom module SPDConv must be registered before loading (see register_modules.py).

# Parameters
nc: 5 # TANDAN: dead, healthy, mismanaged, smallish, yellowish
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLOv12n backbone (A1: SPDConv at layers 3, 5, 7)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2   (kept: early-stage efficiency)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4  (kept: early-stage efficiency)
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, SPDConv, [256]] # 3-P3/8     <-- MODIFIED: was Conv [256, 3, 2]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, SPDConv, [512]] # 5-P4/16    <-- MODIFIED: was Conv [512, 3, 2]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, SPDConv, [1024]] # 7-P5/32   <-- MODIFIED: was Conv [1024, 3, 2]
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLOv12n head (unchanged from base)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)
  - [[14, 17, 20], 1, Detect, [nc]] # Detect(P3, P4, P5)
