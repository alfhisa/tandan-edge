# YOLO11n baseline standar (nc=5) — untuk studi resolusi
# ========================================================
# TIDAK ada modifikasi arsitektur. Dipakai untuk R4: mencari operating point
# resolusi terbaik (640 / 704 / 768) setelah jalur modifikasi arsitektur
# (R1 SCS-Head, R2 SimAM, R3 BiFPN) semuanya gagal.
#
# Acuan @640: mAP50-95 0.9619 ± 0.0023 | 20.2 FPS Jetson | 6.32 GFLOPs
# Proyeksi GFLOPs: 704 -> ~7.6 | 768 -> ~9.1 | 896 -> ~12.4
# Proyeksi FPS Jetson (kuadratik): 704 -> ~16.7 | 768 -> ~14.0 | 896 -> ~10.3

nc: 5 # dead, healthy, mismanaged, smallish, yellowish
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32)

  - [[16, 19, 22], 1, Detect, [nc]]
