# TANDAN-YOLO R3 — YOLO11n + BiFPN weighted fusion (neck)
# ========================================================
# Base: yolo11n standar. SATU perubahan: 4 titik Concat di neck ->
# BiFPNConcat (bobot learnable per cabang, fast normalized fusion).
# Backbone & head TIDAK disentuh (isolasi efek R3).
#
# Params naik 8 skalar saja (2 per titik fusi). GFLOPs praktis identik.
# Bobot init 1.0 -> awal training setara Concat ternormalisasi, sehingga
# gangguan terhadap bobot pretrained minimal (pelajaran dari R2).

nc: 5 # dead, healthy, mismanaged, smallish, yellowish
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, BiFPNConcat, [1]] # 12  <-- MODIFIED (was Concat)
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, BiFPNConcat, [1]] # 15  <-- MODIFIED
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, BiFPNConcat, [1]] # 18 <-- MODIFIED
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, BiFPNConcat, [1]] # 21 <-- MODIFIED
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32)

  - [[16, 19, 22], 1, Detect, [nc]]
